name: Install CableMap APK release 2026-11-14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-cablemap-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cablemap-apk-replace
  cancel-in-progress: false

jobs:
  replace-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original new APK
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d450-8210-96c3-524be0519be8/raw?se=2026-11-14T18%3A51%3A22Z&sp=r&sv=2026-06-06&sr=b&scid=cc114649-e00b-5442-a0bb-9c297bb53a9a&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T05%3A01%3A12Z&ske=2026-11-15T05%3A01%3A12Z&sks=b&skv=2026-06-06&sig=EelJwyu/N/oSvDKdhULJZyq0gPP7YQbgUxnGl0k9uV8%3D'
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --output /tmp/CableMap-new.apk "$SOURCE_URL"
          test "$(stat -c%s /tmp/CableMap-new.apk)" -eq 94304837
          printf '%s  %s\n' a1ac60946f5a1b6efc508e1f996f9395de35a0ffa3d7bf5ee173edb393e9fa68 /tmp/CableMap-new.apk | sha256sum --check
          unzip -t -q /tmp/CableMap-new.apk
      - name: Publish APK on unchanged existing download path
        run: |
          cp /tmp/CableMap-new.apk cablemap-public/CableMap-demo-latest.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cablemap-public/CableMap-demo-latest.apk
          git commit -m 'Update CableMap demo APK with PDF export release 2026-11-14'
          git push origin HEAD:main
