name: Restore calm music to CableMap demo video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-cablemap-music.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cablemap-music-restoration
  cancel-in-progress: false

jobs:
  replace-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with video
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio synthesis dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compose gentle instrumental for the complete video
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 cablemap-public/CableMap-demo-video.mp4)
          echo "Original video duration: $DURATION seconds"
          python scripts/build_cablemap_music.py /tmp/cablemap-ambient.wav "$DURATION"
      - name: Replace old beep with music and leave visual track bit-for-bit copied
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i cablemap-public/CableMap-demo-video.mp4 \
            -i /tmp/cablemap-ambient.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 128k -af 'volume=2.2' \
            -movflags +faststart -shortest \
            -metadata:s:a:0 title='CableMap original calm instrumental' \
            /tmp/cablemap-with-calm-music.mp4
          mv /tmp/cablemap-with-calm-music.mp4 cablemap-public/CableMap-demo-video.mp4
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of compact cablemap-public/CableMap-demo-video.mp4
      - name: Refresh website video cache while retaining all visual styling
        run: |
          sed -i 's@CableMap-demo-video.mp4@CableMap-demo-video.mp4?audio=calm-20261109@g' cablemap-site/index.html
      - name: Commit video with restored music and cache-refresh URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cablemap-public/CableMap-demo-video.mp4 cablemap-site/index.html
          git commit -m 'Replace CableMap demo beep with quiet ambient instrumental; retain video visuals'
          git push origin HEAD:main
