name: Improve Telegram group

on:
  push:
    branches:
      - main
    paths:
      - "telegram-group-publisher/manage-trigger.txt"

permissions:
  contents: write

concurrency:
  group: telegram-group-management
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-group-publisher
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit and improve group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@mobileapplication2026"
        run: python3 telegram_admin.py --apply

      - name: Save sanitized audit
        run: |
          git config user.name "telegram-publisher[bot]"
          git config user.email "telegram-publisher[bot]@users.noreply.github.com"
          git add -- chat_audit.json
          if git diff --cached --quiet; then
            echo "No audit change."
            exit 0
          fi
          git commit -m "Record Telegram group audit"
          git push
