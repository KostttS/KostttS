name: Threads Publisher

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "threads-publisher/posts.json"
      - "threads-publisher/replies.json"
      - "threads-publisher/publish_threads.py"
      - "threads-publisher/monitor_threads.py"
      - "threads-publisher/discover_threads.py"
      - "threads-publisher/recovery-trigger.txt"
      - ".github/workflows/threads-publisher.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Action"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - queue
          - manual
      text:
        description: "Text for a manual post (used only for manual mode)"
        required: false
        type: string
      image_url:
        description: "Optional public image URL"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: threads-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_MODE: ${{ github.event.inputs.mode || 'queue' }}
      THREADS_MANUAL_TEXT: ${{ github.event.inputs.text || '' }}
      THREADS_MANUAL_IMAGE_URL: ${{ github.event.inputs.image_url || '' }}

    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "THREADS_ACCESS_TOKEN is not configured yet. Nothing to publish."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish to Threads
        if: steps.config.outputs.configured == 'true'
        run: python3 threads-publisher/publish_threads.py

      - name: Discover mobile-development opportunities on Threads
        if: steps.config.outputs.configured == 'true'
        run: python3 threads-publisher/discover_threads.py

      - name: Collect Threads analytics and inbox
        if: steps.config.outputs.configured == 'true'
        run: python3 threads-publisher/monitor_threads.py

      - name: Store Threads runtime data
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: threads-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            threads-publisher/analytics.json
            threads-publisher/inbox.json
            threads-publisher/discovery.json
          retention-days: 7
          if-no-files-found: error

      - name: Save public-safe Threads state metadata
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          cat > threads-publisher/runtime_pointer.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "artifact_name": "threads-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          if [ -z "$(git status --porcelain -- threads-publisher/state.json threads-publisher/runtime_pointer.json)" ]; then
            echo "No Threads state metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads-publisher/state.json threads-publisher/runtime_pointer.json
          git commit -m "Update Threads state metadata and runtime pointer"
          # Runtime JSON files are intentionally not committed. Stash any
          # generated/legacy copies before rebasing state metadata.
          git stash push --all -m "threads-runtime-before-rebase" || true
          git pull --rebase
          git push
